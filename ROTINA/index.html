<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Dashboard Acadêmico & Estudos — Sua rotina, tarefas, projetos e estudos em um só lugar.">
  <meta name="theme-color" content="#0c0c0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dashboard">

  <title>Dashboard Acadêmico & Estudos</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c6dfa'/><text y='22' x='6' font-size='18' font-family='sans-serif'>📚</text></svg>">

  <!-- CSS: load in order -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-shell">

    <!-- ── Sidebar (desktop) ── -->
    <aside class="sidebar" role="navigation" aria-label="Navegação principal">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">📚</div>
        <div>
          <div class="sidebar-logo-text">Dashboard</div>
          <div class="sidebar-logo-sub">Acadêmico & Estudos</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item" data-route="dashboard" href="#dashboard" aria-label="Dashboard">
          <span class="nav-item-icon">⊞</span> Dashboard
        </a>
        <a class="nav-item" data-route="rotina" href="#rotina" aria-label="Rotina">
          <span class="nav-item-icon">📅</span> Rotina
        </a>
        <a class="nav-item" data-route="tarefas" href="#tarefas" aria-label="Tarefas">
          <span class="nav-item-icon">☑</span> Tarefas
        </a>
        <a class="nav-item" data-route="projetos" href="#projetos" aria-label="Projetos">
          <span class="nav-item-icon">🚀</span> Projetos
        </a>
        <a class="nav-item" data-route="estudos" href="#estudos" aria-label="Estudos">
          <span class="nav-item-icon">🎯</span> Estudos
        </a>
        <a class="nav-item" data-route="disciplinas" href="#disciplinas" aria-label="Disciplinas">
          <span class="nav-item-icon">🎓</span> Disciplinas
        </a>
        <a class="nav-item" data-route="configuracoes" href="#configuracoes" aria-label="Configurações">
          <span class="nav-item-icon">⚙</span> Configurações
        </a>
      </nav>

      <!-- Focus timer in sidebar -->
      <div class="sidebar-timer">
        <button class="timer-toggle" id="timer-toggle-btn" aria-expanded="false" aria-controls="timer-panel" aria-label="Abrir cronômetro de foco">
          <span>⏱ Cronômetro</span>
          <span style="font-size:10px;color:var(--text-tertiary)">▼</span>
        </button>
        <div class="timer-panel" id="timer-panel" role="region" aria-label="Cronômetro de foco">
          <div id="timer-widget"></div>
        </div>
      </div>
    </aside>

    <!-- ── Main content ── -->
    <main class="main-content" role="main">
      <div id="app-view" aria-live="polite">
        <!-- Page content rendered here by JS -->
      </div>
    </main>

  </div>

  <!-- ── Bottom navigation (mobile only) ── -->
  <nav class="bottom-nav" aria-label="Navegação mobile">
    <a class="bottom-nav-item" data-route="dashboard" href="#dashboard" aria-label="Hoje">
      <span class="bottom-nav-icon">🏠</span>
      <span class="bottom-nav-label">Hoje</span>
    </a>
    <a class="bottom-nav-item" data-route="rotina" href="#rotina" aria-label="Rotina">
      <span class="bottom-nav-icon">📅</span>
      <span class="bottom-nav-label">Rotina</span>
    </a>
    <a class="bottom-nav-item" data-route="tarefas" href="#tarefas" aria-label="Tarefas">
      <span class="bottom-nav-icon">✓</span>
      <span class="bottom-nav-label">Tarefas</span>
    </a>
    <a class="bottom-nav-item" data-route="estudos" href="#estudos" aria-label="Estudos">
      <span class="bottom-nav-icon">📚</span>
      <span class="bottom-nav-label">Estudos</span>
    </a>
    <a class="bottom-nav-item" data-route="configuracoes" href="#configuracoes" aria-label="Configurações">
      <span class="bottom-nav-icon">⚙️</span>
      <span class="bottom-nav-label">Config</span>
    </a>
  </nav>

  <!-- ── Dedicated Focus Overlay Mode ── -->
  <div id="focus-overlay" class="focus-overlay" style="display:none;" role="dialog" aria-modal="true" aria-label="Modo Foco">
    <div class="focus-overlay-content">
      <button class="btn btn-ghost btn-sm focus-close-btn" id="focus-exit-btn">✕ Sair do modo foco</button>
      <div id="focus-overlay-widget"></div>
    </div>
  </div>

  <!-- ── Modal overlay (shared) ── -->
  <div id="modal-overlay" role="dialog" aria-modal="true"></div>

  <!-- ── Toast ── -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ── Scripts: load data first, then modules, then app ── -->
  <script src="data/default-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/studies.js"></script>
  <script src="js/disciplines.js"></script>
  <script src="js/workload.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
